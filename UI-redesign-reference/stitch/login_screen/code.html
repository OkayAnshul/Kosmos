<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kosmos Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1132d4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101322",
                        "surface-dark": "#191e33",
                        "border-dark": "#323b67",
                        "text-secondary": "#929bc9"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #323b67; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a5589; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-gray-900 dark:text-white antialiased transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden group/design-root">
<!-- Offline Status Bar -->
<!-- Logic: Background changes to signify system status, using secondary text color for subtlety -->
<div class="w-full bg-[#1c223a] border-b border-border-dark py-2 px-4 flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-text-secondary animate-pulse">cloud_off</span>
<p class="text-text-secondary text-xs font-medium leading-normal text-center">Offline Mode - Syncing cached data...</p>
</div>
<!-- Main Content Container -->
<!-- Centered vertically and horizontally for focus -->
<div class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-[480px] mx-auto z-10">
<!-- Brand Header -->
<div class="flex flex-col items-center gap-6 mb-10 w-full">
<!-- Logo -->
<div class="relative flex items-center justify-center">
<div class="h-20 w-20 rounded-2xl bg-gradient-to-br from-primary to-[#0a1e80] flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-[40px]">token</span>
</div>
<!-- Decorative blur behind logo -->
<div class="absolute -z-10 bg-primary/30 blur-2xl h-24 w-24 rounded-full"></div>
</div>
<!-- Headings -->
<div class="text-center space-y-2">
<h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Welcome back</h1>
<p class="text-gray-500 dark:text-text-secondary text-base font-normal">Login to your Kosmos workspace</p>
</div>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-5">
<!-- Email Field -->
<div class="group">
<label class="block text-sm font-medium text-gray-700 dark:text-white mb-2 ml-1">Email address</label>
<div class="relative flex items-center">
<div class="absolute left-4 text-text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="form-input flex w-full rounded-lg border-gray-300 dark:border-border-dark bg-white dark:bg-surface-dark text-gray-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-14 pl-11 pr-4 placeholder:text-text-secondary text-base transition-all duration-200" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group">
<div class="flex justify-between items-center mb-2 ml-1">
<label class="text-sm font-medium text-gray-700 dark:text-white">Password</label>
<a class="text-xs font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<div class="absolute left-4 text-text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="form-input flex w-full rounded-lg border-gray-300 dark:border-border-dark bg-white dark:bg-surface-dark text-gray-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-14 pl-11 pr-12 placeholder:text-text-secondary text-base transition-all duration-200" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 text-text-secondary hover:text-white transition-colors flex items-center justify-center p-1 rounded-full hover:bg-white/5" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Inline Error Surface (Currently Hidden/Inactive state shown as comment, active state below) -->
<!-- 
                <div class="flex items-center gap-3 px-4 py-3 bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-900/30 rounded-lg text-red-600 dark:text-red-400 text-sm animate-in fade-in slide-in-from-top-2 duration-300">
                     <span class="material-symbols-outlined text-[20px] shrink-0">error</span>
                     <span>Invalid email or password. Please try again.</span>
                </div>
                -->
<!-- Action Button -->
<!-- State: Normal -->
<button class="mt-2 w-full h-14 bg-primary hover:bg-blue-700 active:bg-blue-800 text-white text-base font-semibold rounded-lg shadow-lg shadow-primary/20 transition-all duration-200 flex items-center justify-center gap-2 group/btn relative overflow-hidden" type="button">
<!-- Overlay for press state (Material 3 style) -->
<div class="absolute inset-0 bg-white/0 group-active/btn:bg-white/10 transition-colors"></div>
<span>Log In</span>
<span class="material-symbols-outlined text-[20px] group-hover/btn:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Loading State Example (Hidden) -->
<!--
                <button type="button" class="mt-2 w-full h-14 bg-primary/80 text-white/80 text-base font-semibold rounded-lg cursor-wait flex items-center justify-center gap-3" disabled>
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Logging in...
                </button>
                -->
</form>
<!-- Footer Navigation -->
<div class="mt-8 flex items-center justify-center gap-1.5 text-sm">
<span class="text-gray-500 dark:text-text-secondary">Don't have an account?</span>
<a class="font-semibold text-primary hover:text-blue-400 hover:underline underline-offset-4 transition-colors" href="#">Sign Up</a>
</div>
</div>
<!-- Decorative Background Element (Subtle grid or gradient) -->
<div class="absolute inset-0 pointer-events-none opacity-20 dark:opacity-40" data-alt="Abstract dotted grid pattern background" style="background-image: radial-gradient(#323b67 1px, transparent 1px); background-size: 32px 32px;">
</div>
<!-- Bottom Spacer for safe area -->
<div class="h-6 w-full"></div>
</div>
</body></html>
