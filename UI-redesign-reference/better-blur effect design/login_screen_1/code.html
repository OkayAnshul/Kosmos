<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kosmos Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00C4B4","primary-dark": "#009E91",
                        "secondary": "#7C3AED","background-light": "#FAFAFA",
                        "background-dark": "#121212",
                        "surface-dark": "#1E1E1E",
                        "surface-light": "#FFFFFF",
                        "border-dark": "#333333",
                        "text-secondary": "#A1A1AA",
                        "accent-pink": "#F472B6"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "3xl": "2rem"
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 3px;
        }
        .dynamic-bg {
            background: radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 196, 180, 0.15) 0%, transparent 40%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-gray-900 dark:text-white antialiased transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden dynamic-bg">
<div class="absolute top-0 right-0 w-64 h-64 bg-primary/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-80 h-80 bg-secondary/10 rounded-full blur-3xl translate-y-1/3 -translate-x-1/4 pointer-events-none"></div>
<div class="flex-1 flex flex-col p-6 w-full max-w-[480px] mx-auto z-10">
<div class="mt-8 mb-8 flex flex-col items-start gap-4">
<div class="flex items-center gap-3">
<div class="h-12 w-12 rounded-xl bg-gradient-to-tr from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20 rotate-3">
<span class="material-symbols-outlined text-white text-[28px]">rocket_launch</span>
</div>
<span class="text-xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-secondary to-primary dark:from-white dark:to-gray-300">Kosmos</span>
</div>
<div class="space-y-1 mt-2">
<h1 class="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white leading-tight">
                    Let's get <br/>
<span class="text-primary">started.</span>
</h1>
<p class="text-gray-500 dark:text-text-secondary text-sm font-medium">Create an account to join the workspace.</p>
</div>
</div>
<form class="w-full flex flex-col gap-5">
<div class="group relative">
<input class="peer form-input flex w-full rounded-2xl border-0 bg-white dark:bg-surface-dark/80 ring-1 ring-gray-200 dark:ring-border-dark text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-surface-dark h-14 px-4 pt-4 placeholder-transparent text-base transition-all duration-200 shadow-sm" id="display_name" placeholder="Display Name" required="" type="text"/>
<label class="absolute left-4 top-1 text-[11px] text-text-secondary font-medium transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-[11px] peer-focus:text-primary cursor-text" for="display_name">Display Name</label>
</div>
<div class="group relative">
<div class="relative">
<input class="peer form-input flex w-full rounded-2xl border-0 bg-white dark:bg-surface-dark/80 ring-1 ring-gray-200 dark:ring-border-dark text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-surface-dark h-14 px-4 pt-4 placeholder-transparent text-base transition-all duration-200 shadow-sm" id="username" placeholder="Username" required="" type="text"/>
<label class="absolute left-4 top-1 text-[11px] text-text-secondary font-medium transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-[11px] peer-focus:text-primary cursor-text" for="username">Username</label>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-1.5 opacity-0 peer-focus:opacity-100 transition-opacity duration-300">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-[10px] font-medium text-primary">Checking...</span>
</div>
</div>
<p class="mt-1.5 text-[11px] text-primary hidden">
<span class="inline-flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">check_circle</span> @kosmos_fan is available!</span>
</p>
</div>
<div class="group relative">
<input autocomplete="email" class="peer form-input flex w-full rounded-2xl border-0 bg-white dark:bg-surface-dark/80 ring-1 ring-gray-200 dark:ring-border-dark text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-surface-dark h-14 px-4 pt-4 placeholder-transparent text-base transition-all duration-200 shadow-sm" id="email" placeholder="Email Address" required="" type="email"/>
<label class="absolute left-4 top-1 text-[11px] text-text-secondary font-medium transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-[11px] peer-focus:text-primary cursor-text" for="email">Email Address</label>
</div>
<div class="grid grid-cols-1 gap-5">
<div class="group relative">
<input autocomplete="new-password" class="peer form-input flex w-full rounded-2xl border-0 bg-white dark:bg-surface-dark/80 ring-1 ring-gray-200 dark:ring-border-dark text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-surface-dark h-14 px-4 pt-4 pr-12 placeholder-transparent text-base transition-all duration-200 shadow-sm" id="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-4 top-1 text-[11px] text-text-secondary font-medium transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-[11px] peer-focus:text-primary cursor-text" for="password">Password</label>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="group relative">
<input autocomplete="new-password" class="peer form-input flex w-full rounded-2xl border-0 bg-white dark:bg-surface-dark/80 ring-1 ring-gray-200 dark:ring-border-dark text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-surface-dark h-14 px-4 pt-4 pr-12 placeholder-transparent text-base transition-all duration-200 shadow-sm" id="confirm_password" placeholder="Confirm Password" required="" type="password"/>
<label class="absolute left-4 top-1 text-[11px] text-text-secondary font-medium transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-[11px] peer-focus:text-primary cursor-text" for="confirm_password">Confirm Password</label>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-green-500 hidden">
<span class="material-symbols-outlined text-[20px]">check</span>
</div>
</div>
</div>
<div class="border-t border-gray-200 dark:border-border-dark pt-2">
<details class="group/details">
<summary class="list-none flex items-center justify-between cursor-pointer py-2 text-sm font-medium text-text-secondary hover:text-primary transition-colors select-none">
<span>Add profile details (Optional)</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-open/details:rotate-180">expand_more</span>
</summary>
<div class="pt-3 pb-2 space-y-4 animate-in slide-in-from-top-2 fade-in duration-200">
<div class="group relative">
<input class="peer form-input flex w-full rounded-2xl border-0 bg-white dark:bg-surface-dark/80 ring-1 ring-gray-200 dark:ring-border-dark text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-surface-dark h-14 px-4 pt-4 placeholder-transparent text-base transition-all duration-200 shadow-sm" id="role" placeholder="Job Title" type="text"/>
<label class="absolute left-4 top-1 text-[11px] text-text-secondary font-medium transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-[11px] peer-focus:text-primary cursor-text" for="role">Job Title</label>
</div>
</div>
</details>
</div>
<div class="mt-2">
<button class="group relative w-full h-14 bg-gray-200 dark:bg-surface-dark text-gray-400 dark:text-gray-600 font-bold rounded-2xl transition-all duration-300 flex items-center justify-center gap-2 overflow-hidden hover:bg-primary hover:text-white hover:shadow-lg hover:shadow-primary/30 dark:hover:text-white cursor-pointer" type="button">
<div class="absolute inset-0 bg-gradient-to-r from-primary to-secondary opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<span class="relative z-10">Create Account</span>
<span class="material-symbols-outlined text-[20px] relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="text-xs text-center mt-3 text-text-secondary">
                    By signing up, you agree to our <a class="underline hover:text-primary" href="#">Terms</a> &amp; <a class="underline hover:text-primary" href="#">Privacy Policy</a>.
                </p>
</div>
</form>
<div class="mt-auto pt-8 pb-4 flex items-center justify-center gap-1.5 text-sm">
<span class="text-gray-500 dark:text-text-secondary">Already a member?</span>
<a class="font-semibold text-primary hover:text-primary-dark hover:underline underline-offset-4 transition-colors" href="#">Log In</a>
</div>
</div>
</div>

</body></html>
